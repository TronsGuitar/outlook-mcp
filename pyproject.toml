[project]
name = "outlook-mcp"
version = "0.1.0"
description = "MCP server giving an LLM read-only access to a personal Outlook.com mailbox via Microsoft Graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Bass" }]
keywords = ["mcp", "outlook", "microsoft-graph", "email", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/TronsGuitar/outlook-mcp"
Repository = "https://github.com/TronsGuitar/outlook-mcp"
Issues = "https://github.com/TronsGuitar/outlook-mcp/issues"

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"
outlook-mcp-auth = "outlook_mcp.auth:cli_login"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]
